name: Export BBIS WACRM schema

on:
  push:
    paths:
      - '.github/workflows/export-bbis-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build custom-schema SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          {
            echo "-- Generated from upstream wacrm migrations"
            echo "-- Target schema is created separately in Supabase"
            echo "SET search_path TO bbis_wacrm, public, extensions;"
            for f in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
              echo
              echo "-- ============================================================"
              echo "-- SOURCE: $f"
              echo "-- ============================================================"
              echo "SET search_path TO bbis_wacrm, public, extensions;"
              cat "$f"
              echo
            done
          } > generated/bbis_wacrm_all.sql
          wc -l generated/bbis_wacrm_all.sql
          wc -c generated/bbis_wacrm_all.sql

      - name: Persist generated SQL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/bbis_wacrm_all.sql
          if git diff --cached --quiet; then
            echo "Generated SQL unchanged"
          else
            git commit -m "chore: generate bbis_wacrm schema SQL"
            git push
          fi

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbis-wacrm-schema
          path: generated/bbis_wacrm_all.sql
          if-no-files-found: error
          retention-days: 3
